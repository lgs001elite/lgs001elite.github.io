---
layout: default
---
{%- comment -%} One blog post (a file in _posts/ named YYYY-MM-DD-title.md). {%- endcomment -%}
<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</div>
