# --- Languages ---------------------------------------------------------------
# English pages live in _pages/, Chinese pages in _pages/zh/ (see README.md, "多语言").
# Pages that are translations of each other share the same `ref:` value; the switch in the
# menu jumps to the matching page (or to that language's home page if there is none).
# Any text field can have a Chinese version with the suffix `_zh` (e.g. title_zh, award_zh);
# Chinese pages show the `_zh` version when it exists and the English text otherwise.
languages:
  - code: en
    label: EN          # text of the switch shown on pages in the other language
    home: /
  - code: zh
    label: 中文
    home: /zh/
show_language_switch: true   # false = hide the EN / 中文 switch (Chinese pages stay online)

# --- Home page ---------------------------------------------------------------
# Which blocks appear under the bio is set by `sections:` in _pages/Main.md.
news_limit: 6          # newest N news items are shown; older ones fold under "Show all news"

# --- Appearance --------------------------------------------------------------
max_width: 800px
navbar_fixed: true
footer_fixed: true
enable_darkmode: true

# =============================================================================
#  Build settings — rarely need changes
# =============================================================================
markdown: kramdown
kramdown:
  input: GFM

collections:
  news:
    output: false      # one-line news items, shown by the `news` section only
  projects:
    output: true       # each file in _projects/ gets its own page
    permalink: /projects/:name/

# Default front matter, so individual files stay short
defaults:
  - scope: { path: "" }
    values: { lang: en, locale: en_US }
  - scope: { path: "_pages/zh" }
    values: { lang: zh, locale: zh_CN }
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "_projects/zh", type: projects }
    values: { lang: zh, locale: zh_CN, permalink: "/zh/projects/:name/" }
  - scope: { path: "", type: posts }
    values: { layout: post, permalink: "/blog/:year/:month/:title/" }
  - scope: { path: "_posts/zh", type: posts }
    values: { lang: zh, locale: zh_CN, permalink: "/zh/blog/:year/:month/:title/" }

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - _bibliography
  - node_modules
  - vendor
  - .jekyll-cache
  - .sass-cache

plugins:
  - jekyll-seo-tag     # <meta> description, canonical URL, Open Graph, JSON-LD
  - jekyll-sitemap     # /sitemap.xml and /robots.txt
