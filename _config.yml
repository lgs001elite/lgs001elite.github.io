description: >-
  Gaosheng's mainpage, it is way to know Gaosheng (an IoT researcher scientist).
  Currently, he is a postdoc researcher in cooperation with <a href="https://sinanyil81.github.io/">Kasım Sinan Yıldırım</a> at the University of Trento, Italy.
  He is trying to build a more sustainable world.
  He earned his PhD degree at VU Amsterdam in April 2025. He was in the group of <a href="https://www.vuhpdc.net/people/" target="_blank">HPDC</a>, supervised by <a href="https://www.vuhpdc.net/henri-bal/" target="_blank">Prof. Henri Bal</a> and <a href="https://linwang.info/" target="_blank">Prof. Lin Wang</a>.
  Before that, he received his Master's degree from Tianjin University in 2019 and earned his Bachelor's degree from Tianjin University of Technology and Education in 2015.
  He also has two years of industry experience at Huawei Beijing R&D Institute from 2019 to 2021.
  His research focuses on communication in batteryless IoT sensing networks including protocol design, hardware design, and system design.
  He is also interested in the application of machine learning in IoT sensing networks.

