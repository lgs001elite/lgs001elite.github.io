# --- Home page ---------------------------------------------------------------
news_limit: 6          # newest N news items are shown; older ones fold under "Show all news"
visitor_map: true      # MapMyVisitors globe below the publications

# --- Appearance --------------------------------------------------------------
max_width: 800px
navbar_fixed: true
footer_fixed: true
enable_darkmode: true

# =============================================================================
#  Build settings — rarely need changes
# =============================================================================
markdown: kramdown
kramdown:
  input: GFM

collections:
  news:
    output: false      # news items are one-liners shown on the home page only

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - _bibliography
  - node_modules
  - vendor
  - .jekyll-cache
  - .sass-cache

plugins:
  - jekyll-seo-tag     # <meta> description, canonical URL, Open Graph, JSON-LD
  - jekyll-sitemap     # /sitemap.xml and /robots.txt
